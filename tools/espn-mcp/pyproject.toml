[project]
name = "espn-mcp"
version = "0.1.0"
description = "MCP server for exploring ESPN fantasy football v3 endpoints"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
espn-mcp = "espn_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/espn_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
