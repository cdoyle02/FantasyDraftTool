[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvs-engine"
version = "0.1.0"
description = "Dependency-light fantasy football draft value engine"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: Monte Carlo convergence and other multi-second checks",
]
