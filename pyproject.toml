[project]
name = "fantasy-draft-tool-workspace"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/dvs-engine"]
exclude = ["tools/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages/dvs-engine/tests", "apps/api/tests"]
